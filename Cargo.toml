[package]
name = "sigmaos-bluetooth"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Bluetooth management and support"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-bluetooth"
readme = "README.md"
keywords = ["bluetooth", "bluez", "wireless"]
categories = ["hardware-support"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }

[profile.release]
opt-level = 3
